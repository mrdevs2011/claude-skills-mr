<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connector kirish</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #0b0b0c; color: #eaeaea;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    padding: 16px; box-sizing: border-box;
  }
  #card {
    width: 100%; max-width: 480px;
    border: 1px solid #333; border-radius: 12px;
    background: #141416; padding: 24px;
  }
  label { display: block; font-size: 13px; color: #9a9a9a; margin-bottom: 6px; margin-top: 14px; }
  label:first-of-type { margin-top: 0; }
  input {
    width: 100%; box-sizing: border-box;
    font: inherit; font-size: 15px;
    background: #0b0b0c; color: #eaeaea;
    border: 1px solid #333; border-radius: 8px;
    padding: 10px 12px;
  }
  button {
    width: 100%; margin-top: 18px;
    font: inherit; font-size: 15px; font-weight: 600;
    background: #eaeaea; color: #0b0b0c;
    border: none; border-radius: 8px;
    padding: 11px 12px; cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  #result {
    margin-top: 18px;
    font-size: clamp(13px, 3.6vw, 17px);
    padding: 14px 16px;
    border: 1px solid #333;
    border-radius: 10px;
    background: #0b0b0c;
    word-break: break-all;
    display: none;
  }
  #result.ok { display: block; color: #6fcf97; cursor: pointer; user-select: all; }
  #result.err { display: block; color: #eb5757; }
  #note { font-size: 12px; color: #666; margin-top: 14px; line-height: 1.5; }
</style>
</head>
<body>
<form id="form">
  <div id="card">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="pass">Parol</label>
    <input id="pass" type="password" autocomplete="current-password" required>
    <button id="btn" type="submit">Kirish</button>
    <div id="result" title="Bosib nusxa olish uchun belgila"></div>
    <div id="note">Email va parol faqat tekshirish uchun serverga yuboriladi, hech qayerda saqlanmaydi.</div>
  </div>
</form>
<script>
  const form = document.getElementById('form');
  const btn = document.getElementById('btn');
  const result = document.getElementById('result');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('pass').value;
    result.className = '';
    result.textContent = '';
    btn.disabled = true;
    btn.textContent = 'Tekshirilmoqda...';
    try {
      const res = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json();
      if (res.ok && data.url) {
        result.className = 'ok';
        result.textContent = data.url;
      } else {
        result.className = 'err';
        result.textContent = data.error || 'Xatolik yuz berdi';
      }
    } catch {
      result.className = 'err';
      result.textContent = 'Serverga ulanib bo\\'lmadi';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Kirish';
    }
  });
</script>
</body>
</html>
